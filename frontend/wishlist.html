<!DOCTYPE html>

<html class="scroll-smooth" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>TIME-X — Wishlist</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&amp;family=Inter:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<script>
        tailwind.config = { theme: { extend: {
            colors: { timexBlack: '#0A0A0A', timexWhite: '#FFFFFF', timexOffWhite: '#FAFAF8', timexCharcoal: '#161616', timexDarkBorder: '#2A2A2A', timexLightGrey: '#E3E3E1', timexTextGrey: '#6B6B6B', timexSilver: '#B8B8B8' },
            fontFamily: { sans: ['Inter', 'Helvetica Neue', 'sans-serif'], serif: ['Cormorant Garamond', 'Georgia', 'serif'] },
            letterSpacing: { widest: '0.2em', mega: '0.3em' }
        } } }
    </script>
<style>
        .font-black { font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 600; letter-spacing: 0.01em; }
        ::selection { background-color: #0A0A0A; color: #FFFFFF; }
    </style>
<link href="assets/css_theme.css" rel="stylesheet"/>
<script src="assets/js/navbar.js"></script>
</head>
<body class="bg-timexBlack text-timexWhite font-sans antialiased page-fade">
<div id="navbar-placeholder"></div>

<section class="pt-32 pb-24">
<div class="max-w-[1200px] mx-auto px-6 lg:px-12">
<span class="text-xs font-mono tracking-mega text-timexLightGrey uppercase block mb-2">Saved</span>
<h1 class="text-4xl sm:text-5xl font-black tracking-tight uppercase mb-12">Your Wishlist.</h1>
<div class="text-center py-24 text-xs uppercase tracking-widest text-timexLightGrey" id="loading-state">Loading…</div>
<div class="hidden text-center py-24 space-y-4" id="empty-state">
<p class="text-sm uppercase tracking-widest text-timexLightGrey">Your wishlist is empty.</p>
<a class="inline-block bg-timexWhite text-timexBlack px-8 py-3 text-xs font-semibold uppercase tracking-widest hover:bg-timexSilver transition-colors" href="shop.html">Shop All Watches</a>
</div>
<div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-x-6 gap-y-12" id="wishlist-grid"></div>
</div>
</section>
<footer class="bg-timexBlack text-timexWhite pt-20 pb-10">
<div class="max-w-[1440px] mx-auto px-6 lg:px-12">
<div class="pt-6 flex flex-col sm:flex-row justify-between items-center gap-4 text-[10px] font-mono tracking-widest text-timexLightGrey uppercase">
<p>© 2026 TIME-X. ALL RIGHTS RESERVED.</p>
</div>
</div>
</footer>
<script src="assets/js/api.js"></script>
<script src="assets/js/shared.js"></script>
<script>
        async function removeItem(productId) {
            await apiJSON('DELETE', `/api/wishlist/${productId}`, {}).catch(() => {});
            showToast('Removed from Wishlist');
            await loadWishlist();
        }

        function itemCardHTML(item) {
            return `
            <div class="group">
                <a href="product.html?slug=${item.slug}" class="block relative w-full aspect-[3/4] bg-timexCharcoal overflow-hidden mb-3 ${!item.in_stock ? 'opacity-50' : ''}">
                    <img src="${item.image || ''}" alt="${item.title}" class="absolute inset-0 w-full h-full object-cover object-center">
                    ${!item.in_stock ? '<span class="absolute bottom-3 left-3 bg-timexWhite text-timexBlack text-[10px] font-semibold uppercase tracking-widest px-2 py-1">Out of Stock</span>' : ''}
                </a>
                <div class="flex justify-between items-start">
                    <div>
                        <a href="product.html?slug=${item.slug}" class="text-xs font-bold uppercase tracking-wider hover:underline underline-offset-2">${item.title}</a>
                        <p class="text-xs font-semibold mt-1">${item.compare_at_price ? `${formatNPR(item.price)} <span class="text-timexLightGrey line-through font-normal text-[10px]">${formatNPR(item.compare_at_price)}</span>` : formatNPR(item.price)}</p>
                    </div>
                    <button onclick="removeItem(${item.product_id})" aria-label="Remove from wishlist" class="text-timexLightGrey hover:text-timexWhite transition-colors flex-shrink-0 mt-0.5">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                    </button>
                </div>
            </div>`;
        }

        async function loadWishlist() {
            const grid = document.getElementById('wishlist-grid');
            const loading = document.getElementById('loading-state');
            const empty = document.getElementById('empty-state');
            try {
                const items = await apiGet('/api/wishlist');
                loading.classList.add('hidden');
                if (!items.length) {
                    empty.classList.remove('hidden');
                    grid.innerHTML = '';
                    return;
                }
                empty.classList.add('hidden');
                grid.innerHTML = items.map(itemCardHTML).join('');
            } catch (e) {
                loading.textContent = 'Could not load your wishlist right now.';
            }
        }
        loadWishlist();
    </script>
</body>
</html>
