name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Test Code Integrity
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Test Application Startup (Catch Syntax/Import Errors)
        run: |
          cd backend
          # This tries to load your FastAPI app. If there is a syntax error, 
          # a bad import, or broken code, this command will crash and stop the deployment!
          python -c "from app.main import app"

  deploy:
    name: Deploy to Server
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Hostinger VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ~/Time-X
            git pull origin main
            cd backend
            chmod +x start.sh || true
            source venv/bin/activate
            pip install -r requirements.txt
            pm2 delete timex-backend || true
            pm2 start ecosystem.config.js
            pm2 save
            pm2 status
            for i in {1..10}; do
              if curl -f -s http://127.0.0.1:8000/api/health > /dev/null 2>&1; then
                echo "TIME-X backend is UP and HEALTHY on port 8000!"
                exit 0
              fi
              echo "Waiting for port 8000 (attempt $i/10)..."
              sleep 2
            done
            echo "Backend failed to become healthy on port 8000! Dumping logs:"
            pm2 logs timex-backend --lines 60 --nostream || true
            exit 1
