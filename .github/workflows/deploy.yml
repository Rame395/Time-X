name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Test Code Integrity
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Test Application Startup (Catch Syntax/Import Errors)
        run: |
          cd backend
          # This tries to load your FastAPI app. If there is a syntax error, 
          # a bad import, or broken code, this command will crash and stop the deployment!
          python -c "from app.main import app"

  deploy:
    name: Deploy to Server
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Hostinger VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ~/Time-X
            git pull origin main
            cd backend
            source venv/bin/activate
            pip install -r requirements.txt
            chmod +x venv/bin/* || true

            # Delete any existing timex-backend process in PM2
            pm2 delete timex-backend || true

            # Start timex-backend using virtualenv uvicorn
            pm2 start "$PWD/venv/bin/uvicorn" --name timex-backend --cwd "$PWD" -- app.main:app --host 127.0.0.1 --port 8000 --workers 2
            pm2 save
            pm2 status

            # Wait for backend to come up and verify health
            echo "Checking backend health on port 8000..."
            for i in $(seq 1 15); do
              if curl -f -s http://127.0.0.1:8000/api/health > /dev/null 2>&1; then
                echo "SUCCESS: TIME-X backend is UP and HEALTHY on port 8000!"
                exit 0
              fi
              echo "Waiting for port 8000 (attempt $i/15)..."
              sleep 2
            done

            echo "ERROR: Backend failed to become healthy on port 8000! Dumping PM2 logs:"
            pm2 logs timex-backend --lines 80 --nostream || true
            exit 1
