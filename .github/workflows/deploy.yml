name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Test Code Integrity
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Test Application Startup (Catch Syntax/Import Errors)
        run: |
          cd backend
          # This tries to load your FastAPI app. If there is a syntax error, 
          # a bad import, or broken code, this command will crash and stop the deployment!
          python -c "from app.main import app"

  deploy:
    name: Deploy to Server
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Hostinger VPS
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USERNAME }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          FAILED=0
          ssh -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" 'bash -s' << 'REMOTE_SCRIPT' > deploy.log 2>&1 || FAILED=1
          set -e
          cd ~/Time-X
          git fetch origin main
          git reset --hard origin/main
          cd backend
          source venv/bin/activate
          pip install -r requirements.txt

          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && source "$NVM_DIR/nvm.sh"

          echo "=== TESTING APPLICATION STARTUP + DATABASE CONNECTION ==="
          venv/bin/python -c "
          from app.main import app
          from app.database import engine
          from sqlalchemy import text
          with engine.connect() as conn:
              res = conn.execute(text('SELECT 1')).scalar()
          print('APP + DB CHECK SUCCESS, result:', res)
          "

          echo "=== RESTARTING TIMEX-BACKEND UNDER PM2 ==="
          pm2 delete timex-backend || true
          pkill -TERM -f "[T]ime-X/backend" || true
          pkill -TERM -f "[a]pp\.main:app" || true
          sleep 2
          pkill -KILL -f "[T]ime-X/backend" || true
          pkill -KILL -f "[a]pp\.main:app" || true
          sleep 1
          pm2 start ecosystem.config.js
          pm2 save
          pm2 status

          echo "=== WAITING FOR PORT 8035 ==="
          for i in $(seq 1 30); do
            if curl -f -s http://127.0.0.1:8035/api/health > /dev/null 2>&1; then
              echo "SUCCESS: TIME-X backend is UP and HEALTHY on port 8035!"
              exit 0
            fi
            echo "Waiting for port 8035 (attempt $i/30)..."
            sleep 2
          done

          echo "ERROR: Backend failed to become healthy on port 8035! Checking port 8035 & nginx:"
          ss -tulpn 2>/dev/null | grep ':8035 ' || true
          grep -rn "proxy_pass" /etc/nginx/sites-enabled/ 2>/dev/null || true
          echo "Dumping PM2 logs:"
          pm2 logs timex-backend --lines 80 --nostream || true
          exit 1
          REMOTE_SCRIPT

          cat deploy.log
          echo "### Deploy Output" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          tail -n 100 deploy.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          if [ "$FAILED" = "1" ]; then
            echo "Deployment failed! See logs above."
            exit 1
          fi
